<style>

*{box-sizing:border-box}

html{scroll-padding-top:env(safe-area-inset-top,0px)}

body.no3d{background:radial-gradient(ellipse at 70% 10%,#fff6,#0000 40%),linear-gradient(180deg,#0a56a0 0%,#37b3e8 45%,#c3efff 62%,#3fae3c 63%,#1c6a2c 100%)}

h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0;font-weight:700}
.it{font-style:italic}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

#labels{position:fixed;inset:0;z-index:2;pointer-events:none}
.plabel{position:absolute;left:0;top:0;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;opacity:0;transition:opacity .4s;text-shadow:0 2px 12px rgb(0 20 60/.8)}
.plabel b{display:block;font:italic 700 20px 'Fraunces',serif}
.plabel span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.plabel.on b{color:var(--accent2)}
.glass{position:relative;isolation:isolate;background:linear-gradient(180deg,rgb(255 255 255/.16),rgb(var(--tint)/.46) 55%,rgb(var(--tint)/.6));border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 44px rgb(0 20 50/.38),inset 0 1px 0 rgb(255 255 255/.55),inset 0 -1px 0 rgb(255 255 255/.08);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);transition:background .8s}
.glass:before{content:"";position:absolute;z-index:-1;inset:0 0 auto 0;height:min(46%,96px);border-radius:inherit;background:linear-gradient(180deg,rgb(255 255 255/.3),rgb(255 255 255/0));pointer-events:none}
.btn{position:relative;display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;border:1px solid rgb(255 255 255/.7);color:#fff;font-weight:600;text-decoration:none;white-space:nowrap;text-shadow:0 1px 2px rgb(0 40 90/.6);background:linear-gradient(180deg,#9aeaff 0%,#35c3f3 47%,#0a8dd2 53%,#2fb6ec 100%);box-shadow:0 5px 16px rgb(0 40 90/.4),inset 0 1px 0 rgb(255 255 255/.8);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.green{background:linear-gradient(180deg,#d4ff8e 0%,#8fdc2a 47%,#4fae10 53%,#86d62c 100%);text-shadow:0 1px 2px rgb(20 70 0/.6)}
.btn.ghost{background:linear-gradient(180deg,rgb(255 255 255/.28),rgb(255 255 255/.06) 50%,rgb(var(--tint)/.4) 52%);box-shadow:inset 0 1px 0 rgb(255 255 255/.6),0 4px 14px rgb(0 20 50/.3)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.icon{padding:9px;width:38px;height:38px;justify-content:center}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent2);font-weight:600}
.dim{color:var(--dim)}
.lcard{width:min(440px,100%);padding:30px 28px 24px;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.brand{display:flex;gap:14px;align-items:center;margin-bottom:20px}
.orbmark{width:54px;height:54px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 26%,#fff 0 8%,#8cf0ff 26%,#1aa7e6 62%,#075a9e);box-shadow:0 6px 18px rgb(0 30 80/.5),inset 0 -8px 14px rgb(0 40 110/.5),inset 0 2px 3px #fff}
.brand h1{font-size:24px;line-height:1.05}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:999px;background:rgb(0 20 50/.35);border:1px solid var(--line);margin-bottom:14px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 10px;font-weight:600;color:var(--dim)}
.seg button.on{color:#fff;background:linear-gradient(180deg,#8fe6ff,#2ab7ee 50%,#0b8bd0 52%,#27aee6);box-shadow:inset 0 1px 0 #fff9,0 2px 8px rgb(0 40 90/.4);text-shadow:0 1px 2px rgb(0 40 90/.6)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:0 0 5px 4px}
.inp{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgb(0 18 48/.4);box-shadow:inset 0 2px 8px rgb(0 0 0/.3);outline:none;margin-bottom:12px}
.inp:focus{border-color:var(--accent2);box-shadow:inset 0 2px 8px rgb(0 0 0/.3),0 0 0 3px rgb(59 214 255/.3)}
.lrow{display:flex;gap:10px;margin-top:6px}
.lrow .btn{flex:1;justify-content:center}
.fine{font-size:11.5px;color:var(--dim);margin:16px 2px 0;line-height:1.5}
#app{position:fixed;inset:0;z-index:4;display:grid;grid-template:64px minmax(0,1fr)/232px minmax(0,1fr);gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));transition:opacity .6s,transform .6s}
#app.away{opacity:0;pointer-events:none;transform:scale(.97)}
#app.pre{opacity:0;transform:translateY(16px)}
.top{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:999px}
.top .orbmark{width:34px;height:34px}
.tbrand{display:flex;align-items:center;gap:10px;font:700 17px 'Fraunces',serif;white-space:nowrap}
.tbrand small{display:block;font:600 9.5px 'Work Sans',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--accent2);margin-top:1px}
.srch{position:relative;flex:1;max-width:560px;margin:0 auto}
.srch input{width:100%;padding:9px 56px 9px 40px;border-radius:999px;border:1px solid var(--line);background:rgb(0 18 48/.38);box-shadow:inset 0 2px 6px rgb(0 0 0/.3);outline:none}
.srch input:focus{border-color:var(--accent2)}
.srch .i{position:absolute;left:13px;top:9px;opacity:.8}
.srch kbd{position:absolute;right:12px;top:9px}
#sres{position:absolute;top:46px;left:0;right:0;padding:6px;max-height:60vh;overflow:auto;z-index:20}
.sr{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer}
.sr:hover,.sr.on{background:rgb(255 255 255/.16)}
.sr small{margin-left:auto;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.12em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:rgb(255 255 255/.1);font-size:12.5px;font-weight:500}
.badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:#ff5a4d;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:1.5px solid #fff;color:#fff}
.menu{position:absolute;right:0;top:46px;width:230px;padding:8px;z-index:30}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;text-align:left}
.menu button:hover{background:rgb(255 255 255/.16)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.side{padding:12px;display:flex;flex-direction:column;gap:4px;overflow:auto;min-height:0}
.side .grp{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:10px 10px 4px}
.nav{display:flex;gap:12px;align-items:center;border:1px solid transparent;background:none;padding:10px 12px;border-radius:12px;text-align:left;font-weight:500;position:relative}
.nav:hover{background:rgb(255 255 255/.12)}
.nav.on{background:linear-gradient(180deg,rgb(255 255 255/.3),rgb(255 255 255/.08) 50%,rgb(255 255 255/.14) 52%);border-color:var(--line);box-shadow:inset 0 1px 0 rgb(255 255 255/.6)}
.nav .n{margin-left:auto;font-size:11px;background:#ff5a4d;border-radius:9px;padding:0 6px;font-weight:700}
.side .sp{flex:1}
.pv{margin-top:8px;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,rgb(var(--tint)/.2),rgb(255 255 255/.12))}
.pv p{margin:0 0 6px;font-size:12px;color:var(--dim);line-height:1.45}
header.top{z-index:10}
#views{overflow:auto;border-radius:16px;scrollbar-width:thin;scrollbar-color:rgb(255 255 255/.4) transparent;padding-right:2px;min-height:0}
.view{padding:2px 2px 90px;animation:rise .55s both}
.hello{padding:24px 26px;display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.hello h1{font-size:clamp(26px,3.4vw,40px);font-style:italic;line-height:1.05;margin:4px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sec{display:flex;align-items:baseline;gap:10px;margin:22px 4px 10px}
.sec h2{font-size:20px;font-style:italic}
.sec span{color:var(--dim);font-size:12.5px}
.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.pad{padding:18px 20px}
.pad h3{font-size:17px;font-style:italic;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.hero3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.app{display:flex;flex-direction:column;gap:12px;padding:18px;text-decoration:none;color:inherit;transition:transform .25s,box-shadow .25s}
.app:hover{transform:translateY(-5px);box-shadow:0 22px 50px rgb(0 20 50/.5),0 0 0 1px rgb(255 255 255/.5),0 0 40px -6px var(--c)}
.top2{display:flex;gap:14px;align-items:center}
.app h3{font-size:19px;font-style:italic}
.app p{margin:0;line-height:1.5;color:var(--dim);font-size:13.5px}
.app .foot{display:flex;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgb(255 255 255/.14);border:1px solid rgb(255 255 255/.25)}
.orb{--c:#2ab7ee;width:60px;height:60px;border-radius:17px;flex:none;position:relative;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 48%,color-mix(in srgb,var(--c) 70%,#000) 100%);border:1px solid rgb(255 255 255/.7);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 55%,transparent),inset 0 -6px 12px rgb(0 0 0/.25),inset 0 1px 0 #fffc}
.orb:after{content:"";position:absolute;left:5%;right:5%;top:3%;height:46%;border-radius:14px 14px 50% 50%/14px 14px 40% 40%;background:linear-gradient(180deg,rgb(255 255 255/.65),rgb(255 255 255/.05))}
.orb svg{width:30px;height:30px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1;filter:drop-shadow(0 1px 2px rgb(0 0 0/.4))}
.orb.sm{width:44px;height:44px;border-radius:13px}.orb.sm svg{width:22px;height:22px}
.star{position:absolute;right:12px;top:12px;border:0;background:none;padding:4px;color:rgb(255 255 255/.55);z-index:2}
.star.on{color:#ffd54a}.star.on svg{fill:#ffd54a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 12px 16px;text-align:center;text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgb(0 20 50/.45),0 0 0 1px rgb(255 255 255/.5)}
.tile b{font-weight:600;font-size:14px}.tile small{color:var(--dim);font-size:12px;line-height:1.35}
.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;gap:12px;align-items:center;padding:10px 8px;border-radius:12px}
.li+.li{border-top:1px solid rgb(255 255 255/.12)}
.li .t{font-weight:600}.li .s{color:var(--dim);font-size:12.5px}
.li .r{margin-left:auto;text-align:right;font-size:12px;color:var(--dim)}
.time{width:78px;font-size:12px;color:var(--dim);flex:none;font-variant-numeric:tabular-nums}
.now{background:linear-gradient(90deg,rgb(var(--tint)/.55),rgb(255 255 255/.14));border:1px solid var(--line)}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--lime);color:#143300}
.pill.b{background:var(--accent);color:#00243d}
.unread:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:none;margin-top:6px}
.chk{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:7px;border:1.5px solid var(--line);background:rgb(0 18 48/.4);flex:none;position:relative;cursor:pointer;margin:0}
.chk:checked{background:linear-gradient(180deg,#d4ff8e,#6fc41a);border-color:#fff}
.chk:checked:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #143300;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.done{opacity:.55;text-decoration:line-through}
.bar{height:7px;border-radius:4px;background:rgb(0 18 48/.45);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--lime))}
.eras{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.era{display:flex;gap:10px;align-items:center;padding:12px;text-decoration:none;color:inherit;border-radius:14px;transition:transform .2s}
.era:hover{transform:translateY(-3px)}
.era i{width:12px;height:36px;border-radius:6px;background:var(--c);box-shadow:0 0 14px var(--c);flex:none}
.era b{display:block;font-size:13px;line-height:1.2}.era small{color:var(--dim);font-size:11.5px}
.lab{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.lab .pad p{margin:0 0 10px;color:var(--dim);font-size:13px}
.big{font:italic 700 34px 'Fraunces',serif;color:var(--accent2);margin:6px 0}
input[type=range]{width:100%;accent-color:var(--accent)}
canvas.spec{width:100%;height:110px;border-radius:12px;background:rgb(0 14 40/.5);border:1px solid var(--line)}
.keys{display:flex;gap:6px}.keys .btn{flex:1;justify-content:center;padding:14px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:9px 8px;text-align:left;border-bottom:1px solid rgb(255 255 255/.14)}
th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
details{border-bottom:1px solid rgb(255 255 255/.14);padding:12px 4px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary:after{content:"+";font-size:18px;color:var(--accent2)}
details[open] summary:after{content:"–"}
details p{margin:8px 0 0;color:var(--dim);line-height:1.55}
kbd{font:600 11px 'Work Sans',sans-serif;padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:rgb(255 255 255/.1);color:var(--dim)}
#hud{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .6s}
#hud.on{opacity:1}
#hud.on>*{pointer-events:auto}
.hudtop{position:absolute;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;pointer-events:none!important}
.hudtop>*{pointer-events:auto}
#hud:not(.on) .hudtop>*{pointer-events:none}
.hudtitle{padding:10px 20px;border-radius:999px;display:flex;gap:12px;align-items:center}
.hudtitle b{font:italic 700 18px 'Fraunces',serif}
#pcard{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);width:min(480px,calc(100% - 28px));padding:16px 18px;opacity:0;transition:.35s;pointer-events:none}
#pcard.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#pcard h3{font-size:22px;font-style:italic}
#pcard p{margin:10px 0 12px;color:var(--dim);line-height:1.5}
.pnav{position:absolute;top:50%;transform:translateY(-50%)}
#flash{position:fixed;inset:0;z-index:50;background:radial-gradient(circle,#fff,#a9ecff 60%,#2ab7ee);opacity:0;pointer-events:none;transition:opacity .5s}
#flash.on{opacity:1}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);z-index:60;padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;font-weight:500}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgb(0 10 30/.45);padding:16px}
#modal .glass{width:min(500px,100%);padding:22px;max-height:90vh;overflow:auto}
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgb(255 255 255/.14)}
.set small{display:block;color:var(--dim);margin-top:2px}
.set .seg{margin:0;min-width:210px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:13px;background:rgb(0 18 48/.5);border:1px solid var(--line);position:relative;flex:none;margin:0}
.sw:after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:linear-gradient(180deg,#fff,#bfe6f5);transition:.2s}
.sw:checked{background:linear-gradient(180deg,#d4ff8e,#6fc41a)}
.sw:checked:after{left:22px}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
@media(max-width:820px){
 #app{grid-template:60px minmax(0,1fr)/minmax(0,1fr);gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(76px + env(safe-area-inset-bottom,0px))}
 .top{grid-column:1}
 .tbrand span,.srch kbd{display:none}
 .side{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));flex-direction:row;justify-content:space-around;padding:6px;border-radius:999px;z-index:6;overflow:visible}
 .side .grp,.side .sp,.pv,.nav span{display:none}
 .nav{padding:10px;border-radius:50%}
 .nav .n{position:absolute;top:0;right:0}
 .hello{padding:18px}
 .hudtitle .eyebrow{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-tod="day">
<canvas id="gl" aria-hidden="true"></canvas>
<div id="vig"></div>
<div id="labels"></div>

<div id="app" class="pre" hidden>
  <header class="top glass">
    <div class="tbrand"><div class="orbmark"></div><div><span>MazInstitute</span><small>Acoustic</small></div></div>
    <div class="srch">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
